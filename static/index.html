<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiMo TTS 语音合成</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f7; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    .container { background: #fff; border-radius: 16px; padding: 32px; width: 480px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    h1 { font-size: 20px; margin-bottom: 24px; color: #1d1d1f; }
    label { display: block; font-size: 14px; color: #6e6e73; margin-bottom: 6px; }
    textarea { width: 100%; height: 100px; border: 1px solid #d2d2d7; border-radius: 10px; padding: 12px; font-size: 15px; resize: vertical; outline: none; transition: border-color 0.2s; }
    textarea:focus { border-color: #0071e3; }
    .row { display: flex; gap: 12px; margin-top: 16px; }
    .row > div { flex: 1; }
    select { width: 100%; border: 1px solid #d2d2d7; border-radius: 10px; padding: 10px 12px; font-size: 14px; outline: none; background: #fff; }
    select:focus { border-color: #0071e3; }
    button { margin-top: 20px; width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button.primary { background: #0071e3; color: #fff; }
    button.primary:hover { background: #0077ed; }
    button.primary:disabled { background: #a1a1a6; cursor: not-allowed; }
    .result { margin-top: 20px; }
    audio { width: 100%; margin-top: 8px; }
    .error { color: #ff3b30; font-size: 14px; margin-top: 12px; }
    .status { color: #6e6e73; font-size: 13px; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
<div class="container">
  <h1>MiMo 语音合成</h1>

  <label for="text">输入文本</label>
  <textarea id="text" placeholder="请输入要转换的文本...">你好，欢迎使用 MiMo 语音合成服务。</textarea>

  <div class="row">
    <div>
      <label for="style">风格</label>
      <select id="style">
        <option value="">默认</option>
        <option value="温柔">温柔</option>
        <option value="悄悄话">悄悄话</option>
        <option value="东北话 开心">东北话 开心</option>
        <option value="开心">开心</option>
        <option value="严肃">严肃</option>
      </select>
    </div>
  </div>

  <button class="primary" id="btn" onclick="convert()">生成语音</button>

  <div class="result" id="result" style="display:none">
    <label>播放</label>
    <audio id="player" controls></audio>
  </div>

  <div class="error" id="error"></div>
  <div class="status" id="status"></div>
</div>

<script>
  async function convert() {
    const text = document.getElementById('text').value.trim();
    const style = document.getElementById('style').value;
    const btn = document.getElementById('btn');
    const player = document.getElementById('player');
    const result = document.getElementById('result');
    const error = document.getElementById('error');
    const status = document.getElementById('status');

    if (!text) { error.textContent = '请输入文本'; return; }
    if (text.length > 1000) { error.textContent = '文本不能超过1000字'; return; }

    error.textContent = '';
    result.style.display = 'none';
    btn.disabled = true;
    btn.textContent = '生成中...';
    status.textContent = '正在调用 API，请稍候...';

    try {
      const res = await fetch('/api/v1/tts/convert', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, style })
      });

      if (!res.ok) {
        const data = await res.json();
        throw new Error(data.message || '请求失败');
      }

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      player.src = url;
      result.style.display = 'block';
      status.textContent = '生成成功，点击播放';
      player.play();
    } catch (e) {
      error.textContent = e.message;
      status.textContent = '';
    } finally {
      btn.disabled = false;
      btn.textContent = '生成语音';
    }
  }
</script>
</body>
</html>
